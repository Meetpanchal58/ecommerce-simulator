name: Daily data

# Every night: take yesterday's published data, simulate the new day(s), check it,
# and publish it again as assets of the `data-latest` release. `ecommerce-sim download`
# fetches these files, so downloaded data is always up to date.
on:
  schedule:
    - cron: "17 21 * * *"        # 02:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        size: [small, full, large]
    env:
      GH_TOKEN: ${{ github.token }}
      ECOMSIM_DATA_REPO: ${{ github.repository }}
      HAS_HF: ${{ secrets.HF_TOKEN != '' }}
      HAS_KAGGLE: ${{ secrets.KAGGLE_API_TOKEN != '' && (vars.KAGGLE_USERNAME != '' || secrets.KAGGLE_USERNAME != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[sql]"
      - name: Continue from the published data (or build it the first time)
        run: |
          if ecommerce-sim download --size ${{ matrix.size }} --data-dir data_${{ matrix.size }}; then
            ecommerce-sim increment --size ${{ matrix.size }} --data-dir data_${{ matrix.size }}
          else
            echo "No published data yet: building from the opening day."
            ecommerce-sim load --size ${{ matrix.size }} --data-dir data_${{ matrix.size }}
          fi
      - name: Analysis tables
        run: |
          ecommerce-sim derive --data-dir data_${{ matrix.size }}
          ecommerce-sim textsql --data-dir data_${{ matrix.size }}
      - name: Publish
        run: |
          python -c "from ecommerce_sim.download import package; package('data_${{ matrix.size }}', '${{ matrix.size }}', 'dist')"
          # (the three sizes run in parallel: whichever finishes first creates the release)
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data" --notes "Generated data, refreshed every night by the Daily data workflow. Download with: ecommerce-sim download --size small|full|large" --latest=false || true
          gh release upload data-latest dist/ecommerce-sim-data-${{ matrix.size }}.tar.gz* --clobber
          # then remove files of this size that this run did not upload (a big shop may switch between one file and parts)
          for old in $(gh release view data-latest --json assets --jq '.assets[].name' | grep "^ecommerce-sim-data-${{ matrix.size }}\.tar\.gz" || true); do
            [ -e "dist/$old" ] || gh release delete-asset data-latest "$old" -y
          done
      - name: Publish to Hugging Face Datasets
        if: env.HAS_HF == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub==0.34.4"
          python -m ecommerce_sim.publish huggingface data_${{ matrix.size }} ${{ matrix.size }}
      - name: Publish to Kaggle Datasets
        if: env.HAS_KAGGLE == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
        run: |
          pip install "kaggle==1.8.0"
          python -m ecommerce_sim.publish kaggle data_${{ matrix.size }} ${{ matrix.size }}
