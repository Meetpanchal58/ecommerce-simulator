name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sql]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (small shop, load + increment equivalence, validation)
        run: pytest -q
      - name: Command line on a small shop
        run: |
          ecommerce-sim load --today 2025-02-15 --products 300 --traffic-scale 0.05 --data-dir ci_data
          ecommerce-sim increment --today 2025-03-01 --products 300 --traffic-scale 0.05 --data-dir ci_data
          ecommerce-sim derive --data-dir ci_data
          ecommerce-sim textsql --data-dir ci_data
